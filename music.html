<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>现场与影音｜A-Lin</title>
    <link rel="icon" type="image/png" href="./imgs/logo-transparent.png">
    <link rel="stylesheet" href="./css/style1.css">
</head>

<body class="inner-body">
    <header class="site-header">
        <div class="shell nav-wrap"><a class="brand" href="./index.html"><img src="./imgs/logo-transparent.png"
                    alt="A-Lin Logo"></a><button class="menu-toggle" aria-label="打开导航" aria-expanded="false">☰</button>
            <nav class="site-nav"><a href="./index.html">首页</a><a href="./about.html">关于 A-Lin</a><a
                    href="./news.html">最新讯息</a><a href="./albums.html">音乐作品</a><a class="active"
                    href="./music.html">现场与影音</a></nav>
        </div>
    </header>
    <main class="inner-page">
        <section class="inner-hero">
            <div class="shell">
                <p class="eyebrow">Live & Audio</p>
                <h1>把耳机戴上，<br><em>现场正在发生。</em></h1>
            </div>
        </section>
        <section class="shell section">
            <p class="eyebrow">Listen</p>
            <h2 class="subtle-title">音乐播放</h2>
            <div class="music-list">
                <div class="track" id="track-1"><span class="track-number">01</span><span
                        class="track-title">爱，请问怎么走</span><audio controls preload="none">
                        <source src="./audioes/A-Lin - 爱 请问怎么走_H.mp3" type="audio/mpeg"></audio></div>
                <div class="track" id="track-2"><span class="track-number">02</span><span
                        class="track-title">幸福了，然后呢</span><audio controls preload="none">
                        <source src="./audioes/A-Lin - 幸福了 然后呢_H.mp3" type="audio/mpeg"></audio></div>
            </div>
            <p class="eyebrow">Watch</p>
            <h2 class="subtle-title">现场影像</h2>
            <div class="video-list">
                <article class="video-item" id="video-1"><video controls preload="metadata" poster="./imgs/cover.jpg">
                        <source src="./videoes/麦搁贡.mp4" type="video/mp4"></video>
                    <h3>麦搁贡 · Live Video</h3>
                </article>
                <article class="video-item"><video controls preload="metadata" poster="./imgs/cover-2.jpg">
                        <source src="./videoes/失恋无罪.mp4" type="video/mp4"></video>
                    <h3>失恋无罪 · Live Video</h3>
                </article>
            </div>
        </section>
    </main>
    <footer class="site-footer">
        <div class="shell footer-grid">
            <div><img class="footer-logo" src="./imgs/logo-transparent.png" alt="A-Lin Logo">
                <p>把心事唱成歌，把歌留给你。</p>
            </div>
            <div class="footer-links"><a href="./index.html">返回首页</a><a href="./about.html">关于 A-Lin</a><a
                    href="./albums.html">音乐作品</a></div>
            <div class="footer-note"><span>OFFICIAL FAN SITE</span><small>© 2026 A-Lin Music Archive</small></div>
        </div>
    </footer>
    <script src="./js/main.js"></script>
